name: Publish Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Choose version and validate release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "name=0.0.0-debug" >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "Release tags must be numeric, for example v0.2 or v1.2.3." >&2
              exit 1
            fi
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          export ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/fm1-release-key.jks"
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_RELEASE_KEY_ALIAS" || -z "$ANDROID_RELEASE_KEY_PASSWORD" ]]; then
            echo "Configure all four ANDROID_RELEASE_* GitHub Actions secrets before publishing." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          echo "ANDROID_RELEASE_KEYSTORE=$ANDROID_RELEASE_KEYSTORE" >> "$GITHUB_ENV"

      - name: Run unit tests and build APK
        shell: bash
        env:
          BUILD_TASK: ${{ github.event_name == 'workflow_dispatch' && ':app:assembleDebug' || ':app:assembleRelease' }}
          APK_PATH: ${{ github.event_name == 'workflow_dispatch' && 'app/build/outputs/apk/debug/app-debug.apk' || 'app/build/outputs/apk/release/app-release.apk' }}
          APK_NAME: ${{ github.event_name == 'workflow_dispatch' && 'fm1-backup-restore-debug.apk' || 'fm1-backup-restore.apk' }}
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            "$BUILD_TASK" \
            "-PreleaseVersionName=${{ steps.version.outputs.name }}" \
            "-PreleaseVersionCode=${{ steps.version.outputs.code }}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$APK_PATH" "$RUNNER_TEMP/release-assets/$APK_NAME"

      - name: Upload manual debug assets and reports
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v6
        with:
          name: manual-debug-assets
          path: |
            ${{ runner.temp }}/release-assets/
            app/build/reports/

      - name: Publish APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/release-assets/fm1-backup-restore.apk
