# Reuse the configuration graph between builds; generated loader assets remain a declared Sync task.
org.gradle.configuration-cache=true
# Compose and lifecycle dependencies use AndroidX namespaces.
android.useAndroidX=true
# Bound Gradle's heap and keep source/diagnostic encoding consistent across developer machines.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
